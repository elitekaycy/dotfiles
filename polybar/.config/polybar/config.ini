[bar/kaycy]
monitor = ${env:MONITOR:}
width = 100%
height = 30
background = #1e1e2e
foreground = #ffffff
modules-left = i3
modules-center = date
modules-right = pulseaudio

font-0 = "JetBrainsMono Nerd Font:size=11;2"

[module/i3]
type = internal/i3

[module/date]
type = internal/date
format = %a %d %b %H:%M
interval = 5

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
format-volume =   <label-volume>%
format-muted =   muted

