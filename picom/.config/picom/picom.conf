# Picom - light compositor config (picom v12 / git)
#
# xrender + vsync: tear-free window moves and fullscreen at ~1% CPU.
# glx on this NVIDIA laptop busy-waits at ~95% CPU regardless of
# __GL_YIELD, so it stays off. No animations by design.

backend = "xrender"
vsync = true
use-damage = true
unredir-if-possible = false

# Rounded corners (i3 draws 2px borders; picom rounds them together with the window)
corner-radius = 8
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
]

# Soft, centred shadow so every window edge reads the same
shadow = true
shadow-radius = 14
shadow-offset-x = -14
shadow-offset-y = -14
shadow-opacity = 0.35
shadow-color = "#000000"
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@"
]

# Quick fade on open/close only
fading = true
fade-in-step = 0.08
fade-out-step = 0.08
fade-delta = 6
no-fading-openclose = false

inactive-opacity = 1.0
active-opacity = 1.0
frame-opacity = 1.0
inactive-opacity-override = false
blur-background = false

mark-wmwin-focused = true
mark-ovredir-focused = true
detect-rounded-corners = true
detect-client-opacity = true
detect-transient = true
detect-client-leader = true

wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; }
    dock = { shadow = false; clip-shadow-above = true; }
    dnd = { shadow = false; }
    popup_menu = { opacity = 0.95; shadow = false; }
    dropdown_menu = { opacity = 0.95; shadow = false; }
}
