# Picom Configuration - Minimal for Performance
# For picom vgit / v12+

# Backend - xrender is stable on NVIDIA hybrid GPUs (glx causes 100% CPU)
backend = "xrender"
use-damage = true

# Rounded corners
corner-radius = 8
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'i3bar'"
]

# Shadows - subtle shadow for depth
shadow = true
shadow-radius = 12
shadow-offset-x = -5
shadow-offset-y = -5
shadow-opacity = 0.3
shadow-color = "#000000"
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'i3bar'",
    "_GTK_FRAME_EXTENTS@:c"
]

# Fading
fading = true
fade-in-step = 0.07
fade-out-step = 0.07
fade-delta = 5

# Opacity
inactive-opacity = 1.0
active-opacity = 1.0
frame-opacity = 1.0
inactive-opacity-override = false

# Blur (disabled for performance)
blur-background = false

# Other
mark-wmwin-focused = true
mark-ovredir-focused = true
detect-rounded-corners = true
detect-client-opacity = true
vsync = false
unredir-if-possible = false
detect-transient = true
detect-client-leader = true

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; }
    dock = { shadow = false; clip-shadow-above = true; }
    dnd = { shadow = false; }
    popup_menu = { opacity = 0.95; }
    dropdown_menu = { opacity = 0.95; }
}
