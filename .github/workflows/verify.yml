name: Verify dotfiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y jq neovim ripgrep shellcheck stow tmux zsh

      - name: Verify install and update workflows
        run: ./scripts/verify.sh
