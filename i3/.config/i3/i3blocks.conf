# ~/.config/i3/i3blocks.conf

separator_block_width=20

# [time]
# label=📅
# command=date '+%Y-%m-%d 🕐 %H:%M:%S'
# interval=1
# color=#f8f8f2

[time]
label=📅
command= ~/.config/i3/i3blocks-date.sh
interval=1
color=#f8f8f2

[wireless]
label=📶
command=nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d':' -f2
interval=10
color=#50fa7b
[ethernet]
label=🌐
command=ip addr show enp3s0 | grep 'inet ' | awk '{print $2}' | cut -d/ -f1
interval=10
color=#50fa7b

