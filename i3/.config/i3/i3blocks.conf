# i3blocks config - Tokyo Night theme with Nerd Font icons

separator_block_width=15
markup=pango

[time]
label=
command=date '+%a %b %d  %H:%M'
interval=30
color=#c0caf5

[wireless]
label=
command=nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d':' -f2 || echo "N/A"
interval=10
color=#7dcfff

[ethernet]
label=󰈀
command=ip addr show enp3s0 2>/dev/null | grep 'inet ' | awk '{print $2}' | cut -d/ -f1 || echo ""
interval=10
color=#7dcfff

[battery]
label=
command=acpi -b 2>/dev/null | awk '{print $4}' | sed 's/,//' || echo "N/A"
interval=30
color=#9ece6a

[volume]
label=󰕾
command=amixer get Master 2>/dev/null | grep -oP '\d+%' | head -1 || echo "N/A"
interval=5
color=#bb9af7

[power]
label=
command=echo ""
interval=once
color=#f7768e
