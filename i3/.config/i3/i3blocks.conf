[battery]
label=🔋
command=acpi -b | awk '{print $4}' | sed 's/,//'
interval=30
color=#f1fa8c

[volume]
label=🔊
command=amixer get Master | grep -o '[0-9]%' | head -1
interval=5
color=#50fa7b

[power]
command=~/.config/i3/i3blocks-power.sh
interval=once
signal=1



