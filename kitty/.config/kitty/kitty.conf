# Modern Kitty Configuration for Programmers
# Place this in ~/.config/kitty/kitty.conf

# Include theme colors (auto-generated by theme switcher)
# Run: ~/.config/themes/scripts/apply-theme.sh <theme-name>
include theme.conf

# Font Configuration
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        14.0

# Alternative fonts (uncomment if you prefer):
# font_family      Fira Code
# font_family      Cascadia Code
# font_family      SF Mono

# Font features for better programming
disable_ligatures never
font_features JetBrainsMono-Regular +zero +onum

# Window Layout & Appearance
window_padding_width 8
window_margin_width 0
single_window_margin_width -1
window_border_width 0.5pt
draw_minimal_borders yes
placement_strategy center
resize_debounce_time 0.1
resize_draw_strategy static

# Modern UI Elements (Linux)
hide_window_decorations yes
wayland_titlebar_color background
linux_display_server auto
x11_bell_volume 0

# Tab Bar Configuration
tab_bar_edge bottom
tab_bar_align left
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_separator " ┇"
tab_activity_symbol "●"
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

# Colors come from theme.conf (included above). Only shape/style settings here.
cursor_shape block
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval -1
url_style curly

# Terminal Bell
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab yes
command_on_bell none

# Window Management
remember_window_size yes
initial_window_width 1200
initial_window_height 800
enabled_layouts tall:bias=50;full_size=1;mirrored=false, stack, fat, grid

# Background (Linux optimized)
background_opacity 0.95
background_blur 64
dynamic_background_opacity yes
background_image none
background_image_layout tiled
background_image_linear no
background_tint 0.0

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# Mouse
mouse_hide_wait 3.0
url_prefixes http https file ftp gemini irc gopher mailto news git
detect_urls yes
copy_on_select no
strip_trailing_spaces never
select_by_word_characters @-./_~?&=%+#
click_interval -1.0
focus_follows_mouse no
pointer_shape_when_grabbed arrow
default_pointer_shape beam
pointer_shape_when_dragging beam

# Performance (Linux optimized)
repaint_delay 10
input_delay 3
sync_to_monitor yes
wayland_enable_ime yes
update_check_interval 0

# VIM-Style Keybindings
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# Window management (vim-like)
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward
map ctrl+shift+` move_window_to_top
map ctrl+shift+r start_resizing_window
map ctrl+shift+1 first_window
map ctrl+shift+2 second_window
map ctrl+shift+3 third_window
map ctrl+shift+4 fourth_window
map ctrl+shift+5 fifth_window

# Tab management (vim-like)
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
map ctrl+shift+alt+t set_tab_title

# Layout management
map ctrl+shift+l next_layout
map ctrl+shift+z toggle_layout stack

# Scrolling (vim-like)
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end
map ctrl+shift+h show_scrollback

# Linux-specific clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection
map shift+insert paste_from_selection
map ctrl+shift+o pass_selection_to_program

# Additional Linux shortcuts
map ctrl+shift+alt+c copy_to_clipboard
map ctrl+shift+alt+v paste_from_clipboard

# Search
map ctrl+shift+/ show_scrollback
map ctrl+shift+f7 focus_visible_window
map ctrl+shift+f8 swap_with_window

# Miscellaneous
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
map ctrl+shift+delete clear_terminal reset active
map ctrl+shift+o pass_selection_to_program
map ctrl+shift+u kitten unicode_input

# Remote control
allow_remote_control yes
listen_on unix:/tmp/mykitty

# Shell integration
shell_integration enabled
term xterm-kitty

# Advanced
close_on_child_death no
allow_hyperlinks yes
show_hyperlink_targets yes

# Startup
startup_session none
clipboard_control write-clipboard write-primary

# Environment (Linux)
env TERM_PROGRAM=kitty
env TERM_PROGRAM_VERSION=0.26.5
env COLORTERM=truecolor

# Linux compositor compatibility
confirm_os_window_close 0
