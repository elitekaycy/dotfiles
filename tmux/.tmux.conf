set-option -sa terminal-overrides ",xterm*:Tc"

bind -n M-H previous-window
bind -n M-L next-window


set -s default-terminal 'tmux-256color'
set -g mouse on

set -g prefix C-g
unbind C-b
bind C-g send-prefix

# Split pane: Ctrl-g p <direction>
bind p switch-client -T pane_keys
bind -T pane_keys n split-window -h -c "#{pane_current_path}"
bind -T pane_keys l split-window -hb -c "#{pane_current_path}"
bind -T pane_keys r split-window -h -c "#{pane_current_path}"
bind -T pane_keys u split-window -vb -c "#{pane_current_path}"
bind -T pane_keys d split-window -v -c "#{pane_current_path}"

# Tab: Ctrl-g t <key>
bind t switch-client -T tab_keys
bind -T tab_keys n new-window
bind -T tab_keys l next-window
bind -T tab_keys h previous-window

# Pane navigation: Ctrl-h/j/k/l (handled by vim-tmux-navigator plugin)

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc,kitty:Tc"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

run '~/.tmux/plugins/tpm/tpm'
